<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro | Agenda Bororó do Oeste</title>
    <link rel="stylesheet" href="css/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <!-- CABEÇALHO E MENU -->
    <header class="topo">
        <div class="w3-content w3-flex topo-conteudo">
            <a href="index.html" class="marca"><span>Agenda</span> Bororó do Oeste</a>
            <nav class="w3-flex menu">
                <a href="index.html">Início</a>
                <a href="eventos.html">Eventos</a>
                <a href="cadastro.html" class="ativo">Seja organizador</a>
                <a href="novo-evento.html">Publicar evento</a>
            </nav>
        </div>
    </header>

    <main class="w3-content w3-container">
        <h1>Cadastro de organizadores</h1>
        <p>Cadastre-se para divulgar seus eventos na agenda da cidade.</p>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form class="w3-card w3-round-large w3-container w3-padding-24 cartao formulario" onsubmit="cadastrar(event)">
            <div id="mensagem" aria-live="polite"></div>
            <label>Nome completo <input class="w3-input w3-border w3-round" name="nome" required></label>
            <label>E-mail <input class="w3-input w3-border w3-round" type="email" name="email" required></label>
            <label>Telefone <input class="w3-input w3-border w3-round" type="tel" name="telefone" placeholder="(11) 91234-5678" required></label>
            <button class="botao botao-azul">Cadastrar</button>
        </form>
    </main>

    <!-- RODAPÉ -->
    <footer class="rodape w3-center w3-padding-24">Agenda Bororó do Oeste · 2026</footer>
    <script src="js/script.js"></script>
</body>
</html>
